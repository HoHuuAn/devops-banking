# Redis HA (Bitnami Redis, master + replica)
# Use: helm upgrade -i redis bitnami/redis -n redis -f values-redis-ha.yaml

architecture: replication

volumePermissions:
  enabled: true

auth:
  enabled: true
  password: "banking-admin"
  sentinel: true

####################
# MASTER
####################
master:
  persistence:
    enabled: true
    size: 20Gi
    storageClass: standard

  podAntiAffinityPreset: soft

####################
# REPLICA
####################
replica:
  replicaCount: 3

  persistence:
    enabled: true
    size: 20Gi
    storageClass: standard

  podAntiAffinityPreset: soft

####################
# SENTINEL (HA auto-failover)
####################
sentinel:
  enabled: true
  replicas: 3

####################
# METRICS (Prometheus redis-exporter sidecar)
####################
metrics:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/redis-exporter
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "200m"
  service:
    port: 9121

# Connection string cho app:
# redis://redis-master.redis.svc.cluster.local:6379/0
