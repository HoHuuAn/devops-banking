_format_version: "3.0"
_transform: true

services:
  - name: api-producer
    url: http://api-producer:8080
    routes:
      - name: api-route
        paths:
          - /api
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
            - http://localhost:8000
          credentials: true
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - X-Session
            - X-Admin-Secret

  - name: notification-service
    url: http://notification-service:8004
    routes:
      - name: notification-ws-route
        paths:
          - /ws
        strip_path: false
        protocols:
          - http
          - https
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
            - http://localhost:8000
          credentials: true
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - X-Session
