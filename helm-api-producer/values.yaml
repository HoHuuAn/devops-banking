nameOverride: ""
fullnameOverride: "api-producer"

replicaCount: 2

image:
  repository: hohuuan2003/devops-banking-api-producer
  tag: v3
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

secret:
  create: true
  name: rabbitmq-connection-secret
  rabbitmqUrl: amqp://banking:bankingpass@rabbitmq.rabbit.svc.cluster.local:5672/

env:
  redisSecretName: banking-db-secret
  redisSecretKey: REDIS_URL
  corsOrigins: http://localhost:3000,https://banking.local,http://banking.local
  otelExporterOtlpEndpoint: http://opentelemetry-collector.monitoring.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 8
  pollingInterval: 10
  cooldownPeriod: 30
  scaleDownStabilizationWindowSeconds: 30
  prometheusServerAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  rateWindow: 1m
  threshold: "15"
  activationThreshold: "3"
