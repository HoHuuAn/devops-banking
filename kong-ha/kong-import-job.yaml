# Import declarative Kong config into the Kong database.
# Run this after Kong is deployed (namespace: kong) and
# api-producer + consumers are running (namespace: banking).
#
# Usage:
#   kubectl apply -f kong-ha/kong-import-job.yaml
#   kubectl rollout restart deployment -n kong -l app.kubernetes.io/name=kong
#
# Notes:
# - Restart Kong after the job completes so new routes are loaded from DB.
# - If old routes already exist, remove overlapping routes first via Admin API.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: kong
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    services:
      # Route all /api/* traffic to api-producer (RabbitMQ-backed processing).
      - name: api-producer
        url: "http://api-producer.banking.svc.cluster.local:8080"
        connect_timeout: 10000   # 10s connect timeout
        read_timeout: 60000      # 60s read timeout for upstream response
        write_timeout: 60000     # 60s write timeout
        routes:
          - name: api-route
            paths: ["/api"]
            strip_path: false
        plugins:
          - name: cors
            config:
              origins: ["http://localhost:3000", "https://banking.co", "http://banking.co"]
              credentials: true
              methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
              headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "X-Session", "X-Admin-Secret"]
          - name: rate-limiting
            config:
              second: 2000     # 2k req/s per IP (for high concurrency load tests)
              minute: 50000    # 50k req/min
              hour: 200000     # 200k req/hour
              policy: local    # per Kong pod (2 replicas ~= 2x total limit)
              fault_tolerant: true
              hide_client_headers: false  # return X-RateLimit-* headers
      # Route /ws to notification-service for websocket traffic.
      - name: notification-service
        url: "http://notification-service.banking.svc.cluster.local:8004"
        routes:
          - name: notification-ws-route
            paths: ["/ws"]
            strip_path: false
            protocols: ["http", "https"]
        plugins:
          - name: cors
            config:
              origins: ["http://localhost:3000", "https://banking.co", "http://banking.co"]
              credentials: true
              methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
              headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "X-Session"]
    plugins:
      - name: prometheus
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-config-import
  namespace: kong
  labels:
    app: kong-config-import
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: import
          image: kong:3.4
          env:
            - name: KONG_DATABASE
              value: "postgres"
            - name: KONG_PG_HOST
              value: "postgres-postgresql-primary.postgres.svc.cluster.local"
            - name: KONG_PG_PORT
              value: "5432"
            - name: KONG_PG_DATABASE
              value: "kong"
            - name: KONG_PG_USER
              value: "kong"
            - name: KONG_PG_PASSWORD
              value: "kongpass"
          command:
            - /bin/sh
            - -c
            - |
              kong config db_import /kong/kong.yml && echo "Kong config import done"
          volumeMounts:
            - name: config
              mountPath: /kong
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kong-declarative-config
