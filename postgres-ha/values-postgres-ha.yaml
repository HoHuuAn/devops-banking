# Postgres HA (Bitnami PostgreSQL, primary + read replica)
# Run : helm upgrade -i postgres-ha bitnami/postgresql -n postgres -f values-postgres-ha.yaml

auth:
  enablePostgresUser: true
  postgresPassword: "bankingpass"
  username: "banking"
  password: "bankingpass"
  database: "banking"
  replicationUsername: "repl_user"
  replicationPassword: "replpass"

volumePermissions:
  enabled: true

# HA: primary + 1 read replica
architecture: replication

primary:
  replicaCount: 1
  # max_connections: 500 CCU→300, 1000 CCU→500-600 (consumers × pool + overhead)
  extendedConfiguration: |-
    max_connections = 500
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

readReplicas:
  replicaCount: 1
  # Standby must have max_connections >= primary (500), otherwise replication fails
  extendedConfiguration: |-
    max_connections = 500
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

####################
# METRICS (Prometheus postgres-exporter sidecar)
####################
metrics:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/postgres-exporter
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "200m"
  service:
    ports:
      metrics: 9187

# Connection string for app (primary):
# postgresql://banking:bankingpass@postgres-postgresql-primary.postgres.svc.cluster.local:5432/banking
# (Service name = <release>-postgresql when fullnameOverride is not set)
