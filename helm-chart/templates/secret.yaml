{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "banking.secretName" . }}
  namespace: {{ include "banking.namespace" . }}
  labels:
    {{- include "banking.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secret.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secret.postgresDb | quote }}
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secret.redisUrl | quote }}
  ADMIN_SECRET: {{ default .Values.global.adminSecret .Values.global.ADMIN_SECRET | quote }}
  CORS_ORIGINS: {{ .Values.global.corsOrigins | quote }}
  RABBITMQ_URL: {{ .Values.global.rabbitmqUrl | quote }}
{{- end }}
