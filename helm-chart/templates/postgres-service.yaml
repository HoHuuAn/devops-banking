{{- $postgres := .Values.postgres | default dict -}}
{{- if $postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "banking.postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- with $postgres.hook }}
  {{- if and .preInstall .preUpgrade }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ .weight | quote }}
  {{- end }}
  {{- end }}
  labels:
    app: {{ include "banking.postgres.fullname" . }}
    {{- include "banking.postgres.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
      name: {{ .Values.postgres.service.portName }}
  {{- if .Values.postgres.service.clusterIP }}
  clusterIP: {{ .Values.postgres.service.clusterIP }}
  {{- end }}
  selector:
    {{- include "banking.postgres.selectorLabels" . | nindent 4 }}
{{- end }}

