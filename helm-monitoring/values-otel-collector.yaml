# OpenTelemetry Collector - receives OTLP from services and exports traces to Tempo
# Chart: open-telemetry/opentelemetry-collector
# Update config.exporters.otlp/tempo endpoint if Tempo service name changes

# Service name = opentelemetry-collector (apps point to opentelemetry-collector.monitoring...)
fullnameOverride: opentelemetry-collector
namespaceOverride: monitoring
mode: deployment
replicaCount: 1

# New chart versions require image.repository to be set
image:
  repository: otel/opentelemetry-collector-contrib
  # tag: "0.102.0"  # Optional: pin image version if desired

# Config: OTLP in -> Tempo exporter (health_check is required for probes)
config:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    debug:
      verbosity: basic
  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo, debug]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
