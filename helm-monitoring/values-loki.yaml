# Loki — monolithic single replica (Grafana Loki Helm chart)
# Chart: grafana/loki
# Adjust persistence, MinIO, or other object storage if needed.

loki:
  # Grafana datasource (no-auth) will error 401 "no org id" if Loki multi-tenancy is enabled.
  # For lab/dev, disable auth for simplicity.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem # Use filesystem instead of S3 for local deployment
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    # Prefer explicit app/service labels for Logs Drilldown service discovery.
    discover_service_name:
      - service_name
      - service
      - app_kubernetes_io_name
      - app
      - job
      - container
  volume_enabled: true
  ruler:
    enable_api: true
  # MinIO disabled - use filesystem storage with PVC
  minio:
    enabled: false
  # Storage config for filesystem
  storage:
    type: filesystem
    filesystem:
      # Loki config expects `chunks_directory` / `rules_directory` (not `directory`)
      # IMPORTANT: must point to path mounted by PVC (chart usually mounts at /var/loki)
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

deploymentMode: SingleBinary

# Scheduling: cluster has taint `ingress=only` and `control-plane`,
# and worker nodes might lack RAM. Allow Loki pods to schedule on these nodes.
tolerations:
  - key: "ingress"
    operator: "Equal"
    value: "only"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

singleBinary:
  initContainers:
    - name: volume-permissions
      image: busybox:1.36
      command:
        ["sh", "-c", "chown -R 10001:10001 /var/loki && chmod -R 777 /var/loki"]
      volumeMounts:
        - name: storage
          mountPath: /var/loki
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
  replicas: 1
  # Reduce resource limits to avoid Insufficient memory (increase if needed)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  persistence:
    enabled: true
    size: 10Gi
    # IMPORTANT: grafana/loki chart usually uses `storageClass` key (not `storageClassName`)
    # If cluster has default StorageClass, this can be empty.
    storageClass: standard
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    mountPath: /var/loki

# Cache pods (memcached) are often Pending due to RAM.
# These keys are common in grafana/loki chart; if your chart doesn't use them, they are ignored.
memcached:
  tolerations:
    - key: "ingress"
      operator: "Equal"
      value: "only"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Disable cache to reduce pods/RAM and avoid DNS SRV errors when chunks-cache is Pending.
# (Set both key formats for multi-version compatibility)
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcachedChunks:
  enabled: false
memcachedResults:
  enabled: false

# Other deployment modes = 0
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
