# Grafana Tempo — tracing backend nhẹ, integrate well with Grafana
# Chart: grafana/tempo
# receive OTLP directly or via OTEL Collector

tempo:
  # OTLP receiver — app/OTel Collector send traces
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  # Keep trace in 24h
  retention: 24h
  # Metrics-generator (Span rate / Service graph).
  # With chart grafana/tempo, values are `tempo.metricsGenerator.*` (render `metrics_generator.*` in config).
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    storage:
      path: /var/tempo/generator
      # remote_write: []  # optional: dùng remoteWriteUrl nếu không set
    traces_storage:
      path: /var/tempo/generator-traces

  # Storage: local (filesystem) — đủ cho dev/test
  # Production nên dùng S3/GCS/MinIO
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

# Ensure the Tempo process can write to the PV mount in local dev.
securityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0
  runAsNonRoot: false

# Persistence — bật để giữ traces khi pod restart
persistence:
  enabled: true
  size: 5Gi
  storageClass: standard
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  mountPath: /var/tempo

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Service ports (default)
# - 3100: HTTP API (Grafana datasource)
# - 4317: OTLP gRPC
# - 4318: OTLP HTTP
