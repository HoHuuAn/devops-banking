# Grafana Tempo - lightweight tracing backend with Grafana integration
# Chart: grafana/tempo
# Receives OTLP directly or via OpenTelemetry Collector

tempo:
  # OTLP receiver - app services/OpenTelemetry Collector send traces
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  # Keep trace in 24h
  retention: 24h
  # Metrics-generator (Span rate / Service graph).
  # With chart grafana/tempo, values are `tempo.metricsGenerator.*` (render `metrics_generator.*` in config).
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    storage:
      path: /var/tempo/generator
      # remote_write: []  # Optional: use remoteWriteUrl if this is not set
    traces_storage:
      path: /var/tempo/generator-traces

  # Storage: local filesystem (suitable for dev/test)
  # For production, use object storage such as S3/GCS/MinIO.
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

# Ensure the Tempo process can write to the PV mount in local dev.
securityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0
  runAsNonRoot: false

# Persistence - enabled to keep traces across pod restarts
persistence:
  enabled: true
  size: 5Gi
  storageClass: standard
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  mountPath: /var/tempo

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Service ports (default)
# - 3100: HTTP API (Grafana datasource)
# - 4317: OTLP gRPC
# - 4318: OTLP HTTP
