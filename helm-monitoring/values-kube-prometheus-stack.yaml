# Kube Prometheus Stack — Prometheus + Grafana (+ Alertmanager, operator)
# Helm chart: prometheus-community/kube-prometheus-stack
# Adjust namespace, additionalScrapeConfigs (banking), Grafana datasources (Loki, Tempo).

namespaceOverride: monitoring

# Minikube control-plane metrics endpoints are often not exposed; disable to avoid red targets.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false

# Prometheus: thêm scrape config cho banking services (KEDA dùng job name)
prometheus:
  ingress:
    enabled: true
    ingressClassName: haproxy
    hosts:
      - prometheus.banking.local
  prometheusSpec:
    # Allow Tempo metrics-generator remote_write to Prometheus
    enableRemoteWriteReceiver: true
    additionalScrapeConfigs:
      - job_name: auth-service
        metrics_path: /metrics
        static_configs:
          - targets: ["auth-service.banking.svc.cluster.local:8001"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: auth-service
      - job_name: account-service
        metrics_path: /metrics
        static_configs:
          - targets: ["account-service.banking.svc.cluster.local:8002"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: account-service
      - job_name: transfer-service
        metrics_path: /metrics
        static_configs:
          - targets: ["transfer-service.banking.svc.cluster.local:8003"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: transfer-service
      - job_name: notification-service
        metrics_path: /metrics
        static_configs:
          - targets: ["notification-service.banking.svc.cluster.local:8004"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: notification-service
      # - job_name: api-producer
      #   metrics_path: /metrics
      #   static_configs:
      #     - targets: ["api-producer.banking.svc.cluster.local:8080"]
      #   relabel_configs:
      #     - source_labels: [__address__]
      #       target_label: instance
      #       replacement: api-producer
      # Kong Admin API metrics — Kong runs in 'kong' namespace.
      - job_name: kong
        metrics_path: /metrics
        static_configs:
          - targets: ["kong-kong-admin.kong.svc.cluster.local:8001"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: kong
      # Redis exporter in redis namespace 
      - job_name: redis
        metrics_path: /metrics
        static_configs:
          - targets: ["redis-exporter.redis.svc.cluster.local:9121"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: redis
      # Postgres exporter in postgres namespace
      # - job_name: postgres
      #   metrics_path: /metrics
      #   static_configs:
      #     - targets: ["postgres-exporter.postgres.svc.cluster.local:9187"]
      #   relabel_configs:
      #     - source_labels: [__address__]
      #       target_label: instance
      #       replacement: postgres
      # PostgreSQL HA primary (Phase 5 — Bitnami metrics sidecar, namespace postgres)
      - job_name: postgres
        metrics_path: /metrics
        static_configs:
          - targets: ['postgres-postgresql-primary-metrics.postgres.svc.cluster.local:9187']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: postgres
      # PostgreSQL HA read replica
      - job_name: postgres-replica
        metrics_path: /metrics
        static_configs:
          - targets: ['postgres-postgresql-read-metrics.postgres.svc.cluster.local:9187']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: postgres-replica

# Grafana: datasources Loki + Tempo
grafana:
  adminPassword: admin
  # Persistence: PVC để lưu password admin, dashboards, datasources, users
  persistence:
    enabled: true
    type: pvc
    storageClassName: "standard"
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    # annotations: {}  # Thêm annotations nếu cần
  initChownData:
    enabled: false
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
    runAsNonRoot: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
    - name: Tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false

  ingress:
    enabled: true
    ingressClassName: haproxy
    hosts:
      - grafana.banking.local
