# Redis Exporter — Prometheus metrics for Redis HA (namespace redis)
# Apply: kubectl apply -f redis-exporter.yaml -n redis
# Prometheus scrape target: redis-exporter.redis.svc.cluster.local:9121
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: redis
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          # Use Docker Hub instead of quay.io (quay.io may be rate-limited)
          image: oliver006/redis_exporter:v1.80.1
          args:
            - --redis.addr=redis://redis-master.redis.svc.cluster.local:6379
            - --redis.password=banking-admin
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: redis
  labels:
    app: redis-exporter
spec:
  type: ClusterIP
  ports:
    - port: 9121
      targetPort: 9121
      name: metrics
  selector:
    app: redis-exporter
