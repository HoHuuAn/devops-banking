name: CI

# ============================================================
# Triggers: push to main/dev
# Builds:  api-producer, auth-service, account-service,
#          transfer-service, notification-service, frontend
# Registry: Docker Hub (hohuuan2003/devops-banking)
# ============================================================

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_REPO: ${{ format('{0}/devops-banking', secrets.DOCKER_USERNAME) }}
  RELEASE_TAG: v3

on:
  push:
    branches: [main, dev, version2, version3]
    paths:
      # Only rebuild when source code changes
      - 'services/**'
      - 'frontend/**'
      - 'common/**'
      - 'producer/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'docker-compose.deploy.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'

  # Manual trigger
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (all or specific)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - auth-service
          - account-service
          - transfer-service
          - notification-service
          - frontend
          - api-producer


jobs:
  # ============================================================
  # Stage 1: Detect which services changed
  # ============================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services-list: ${{ steps.services.outputs.list }}
      any-change: ${{ steps.services.outputs.any }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            auth-service:
              - 'services/auth-service/**'
            account-service:
              - 'services/account-service/**'
            transfer-service:
              - 'services/transfer-service/**'
            notification-service:
              - 'services/notification-service/**'
            api-producer:
              - 'producer/**'
            frontend:
              - 'frontend/**'
            common:
              - 'common/**'
            backend:
              - 'backend/**'
            workflow:
              - '.github/workflows/**'

      - name: Build services list
        id: services
        run: |
          # Manual trigger → use selected services
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.services }}" == "all" ]; then
              echo "list=api-producer,auth-service,account-service,transfer-service,notification-service,frontend" >> $GITHUB_OUTPUT
            else
              echo "list=${{ github.event.inputs.services }}" >> $GITHUB_OUTPUT
            fi
            echo "any=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Auto detect — common/backend/workflow changes affect all services
          CHANGED=""
          [ "${{ steps.filter.outputs.auth-service }}" == "true" ]       && CHANGED="$CHANGED,auth-service"
          [ "${{ steps.filter.outputs.account-service }}" == "true" ]      && CHANGED="$CHANGED,account-service"
          [ "${{ steps.filter.outputs.transfer-service }}" == "true" ]   && CHANGED="$CHANGED,transfer-service"
          [ "${{ steps.filter.outputs.notification-service }}" == "true" ] && CHANGED="$CHANGED,notification-service"
          [ "${{ steps.filter.outputs.api-producer }}" == "true" ]         && CHANGED="$CHANGED,api-producer"
          [ "${{ steps.filter.outputs.frontend }}" == "true" ]            && CHANGED="$CHANGED,frontend"
          [ "${{ steps.filter.outputs.common }}" == "true" ]              && CHANGED="$CHANGED,api-producer,auth-service,account-service,transfer-service,notification-service"
          [ "${{ steps.filter.outputs.backend }}" == "true" ]             && CHANGED="$CHANGED,api-producer,auth-service,account-service,transfer-service,notification-service"
          [ "${{ steps.filter.outputs.workflow }}" == "true" ]            && CHANGED="$CHANGED,api-producer,auth-service,account-service,transfer-service,notification-service,frontend"

          CHANGED=$(echo "$CHANGED" | sed 's/^,//' | tr ',' '\n' | sort -u | grep -v '^$' | tr '\n' ',' | sed 's/,$//')

          if [ -z "$CHANGED" ]; then
            echo "list=none" >> $GITHUB_OUTPUT
            echo "any=false" >> $GITHUB_OUTPUT
          else
            echo "list=$CHANGED" >> $GITHUB_OUTPUT
            echo "any=true" >> $GITHUB_OUTPUT
          fi
          echo "Changed: $CHANGED"

  # ============================================================
  # Stage 2: Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff ruff-format

      - name: Lint Python code
        run: |
          ruff check common/ services/ producer/ --select E,F,W --ignore E501
          ruff format --check common/ services/ producer/ || true

      - name: Lint Dockerfiles
        run: |
          for svc in auth-service account-service transfer-service notification-service; do
            df="services/$svc/Dockerfile"
            if [ -f "$df" ]; then
              echo "Checking $df"
              grep -q ":latest" "$df" && echo "WARN: Using :latest in $df" || true
            fi
          done
          [ -f "producer/Dockerfile" ] && grep -q ":latest" "producer/Dockerfile" && echo "WARN: Using :latest in producer/Dockerfile" || true

  # ============================================================
  # Stage 3: Test
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [detect-changes, lint]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r common/requirements.txt

      - name: Install E2E test deps
        run: pip install requests

      - name: Syntax check
        run: |
          python -m compileall common/ services/ producer/ -q
          echo "Syntax check passed"

      - name: Smoke test — import all modules
        run: |
          (cd services/auth-service && python -c "import sys; sys.path.insert(0, '../common'); print('auth-service OK')")
          (cd services/account-service && python -c "import sys; sys.path.insert(0, '../common'); print('account-service OK')")
          (cd services/transfer-service && python -c "import sys; sys.path.insert(0, '../common'); print('transfer-service OK')")
          (cd services/notification-service && python -c "import sys; sys.path.insert(0, '../common'); print('notification-service OK')")
          (cd producer && python -c "import sys; sys.path.insert(0, '../common'); print('api-producer OK')")

      - name: End-to-end test (auth, transfer, notifications)
        if: needs.detect-changes.outputs.any-change == 'true'
        run: |
          set -e
          docker compose -f docker-compose.yml up -d --build

          # Wait until gateway is reachable via frontend path.
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/auth/health >/dev/null; then
              echo "Gateway is ready"
              break
            fi
            sleep 2
          done

          python - <<'PY'
          import time
          import requests

          BASE = "http://localhost:3000"

          def req(method, path, **kwargs):
              return requests.request(method, BASE + path, timeout=25, **kwargs)

          suffix = str(int(time.time()))[-8:]
          phone1 = f"09{suffix}01"
          phone2 = f"09{suffix}02"
          user1 = f"ci_user1_{suffix}"
          user2 = f"ci_user2_{suffix}"

          for phone, username in [(phone1, user1), (phone2, user2)]:
              r = req("POST", "/api/auth/register", json={
                  "phone": phone,
                  "username": username,
                  "password": "123456",
              })
              if r.status_code not in (200, 409):
                  raise SystemExit(f"register failed: {r.status_code} {r.text}")

          login1 = req("POST", "/api/auth/login", json={"phone": phone1, "password": "123456"})
          login2 = req("POST", "/api/auth/login", json={"phone": phone2, "password": "123456"})
          assert login1.status_code == 200, f"login1 failed: {login1.status_code} {login1.text}"
          assert login2.status_code == 200, f"login2 failed: {login2.status_code} {login2.text}"

          s1 = login1.json()["session"]
          s2 = login2.json()["session"]
          h1 = {"X-Session": s1}
          h2 = {"X-Session": s2}

          me1_before = req("GET", "/api/account/me", headers=h1)
          me2_before = req("GET", "/api/account/me", headers=h2)
          assert me1_before.status_code == 200, f"me1 before failed: {me1_before.status_code} {me1_before.text}"
          assert me2_before.status_code == 200, f"me2 before failed: {me2_before.status_code} {me2_before.text}"
          u1_before = me1_before.json()
          u2_before = me2_before.json()

          transfer = req("POST", "/api/transfer/transfer", headers=h1, json={
              "to_account_number": u2_before["account_number"],
              "amount": 1000,
          })
          assert transfer.status_code == 200, f"transfer failed: {transfer.status_code} {transfer.text}"

          me1_after = req("GET", "/api/account/me", headers=h1).json()
          me2_after = req("GET", "/api/account/me", headers=h2).json()

          assert me1_after["balance"] == u1_before["balance"] - 1000, (
              f"sender balance mismatch: {u1_before['balance']} -> {me1_after['balance']}"
          )
          assert me2_after["balance"] == u2_before["balance"] + 1000, (
              f"receiver balance mismatch: {u2_before['balance']} -> {me2_after['balance']}"
          )

          notif1 = req("GET", "/api/notifications/notifications", headers=h1)
          notif2 = req("GET", "/api/notifications/notifications", headers=h2)
          assert notif1.status_code == 200, f"notif1 failed: {notif1.status_code} {notif1.text}"
          assert notif2.status_code == 200, f"notif2 failed: {notif2.status_code} {notif2.text}"

          msg1 = (notif1.json() or [{}])[0].get("message", "")
          msg2 = (notif2.json() or [{}])[0].get("message", "")
          assert msg1.startswith("You sent "), f"sender notification not English: {msg1}"
          assert msg2.startswith("You received "), f"receiver notification not English: {msg2}"

          print("E2E OK: transfer updates balances and notifications are English.")
          PY

      - name: Cleanup E2E environment
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans || true

  # ============================================================
  # Stage 4: Build Docker images → save as artifacts
  # ============================================================
  build-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, test]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - name: account-service
            context: .
            dockerfile: services/account-service/Dockerfile
          - name: transfer-service
            context: .
            dockerfile: services/transfer-service/Dockerfile
          - name: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - name: api-producer
            context: .
            dockerfile: producer/Dockerfile
    steps:
      - name: Check if service is in build list
        id: should-build
        run: |
          LIST="${{ needs.detect-changes.outputs.services-list }}"
          if [ "$LIST" == "none" ] || [ -z "$LIST" ]; then
            echo "build=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if echo ",$LIST," | grep -q ",${{ matrix.service.name }},"; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v5
        if: steps.should-build.outputs.build == 'true'

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags)
        if: steps.should-build.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPO }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=${{ env.RELEASE_TAG }}

      - name: Build image tar
        if: steps.should-build.outputs.build == 'true'
        run: |
          echo "Building image tar for ${{ matrix.service.name }}"
          TAG_ARGS=""
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              TAG_ARGS="$TAG_ARGS -t $tag"
            fi
          done << 'EOF'
          ${{ steps.meta.outputs.tags }}
          EOF

          docker buildx build \
            $TAG_ARGS \
            -f "${{ matrix.service.dockerfile }}" \
            "${{ matrix.service.context }}" \
            --output type=docker,dest=/tmp/image-${{ matrix.service.name }}.tar \
            --cache-from type=gha \
            --cache-to type=gha,mode=max

          if [ $? -ne 0 ]; then
            echo "ERROR: Build failed for ${{ matrix.service.name }}"
            exit 1
          fi
          echo "Build completed for ${{ matrix.service.name }}"

      - name: Upload image artifact
        if: steps.should-build.outputs.build == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: image-${{ matrix.service.name }}
          path: /tmp/image-${{ matrix.service.name }}.tar
          retention-days: 1

  # ============================================================
  # Stage 5: Push images to Docker Hub
  # ============================================================
  push-images:
    name: Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - account-service
          - transfer-service
          - notification-service
          - frontend
          - api-producer
    steps:
      - name: Check if service was built
        id: should-push
        run: |
          LIST="${{ needs.detect-changes.outputs.services-list }}"
          if [ "$LIST" == "none" ] || [ -z "$LIST" ]; then
            echo "push=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if echo ",$LIST," | grep -q ",${{ matrix.service }},"; then
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
          fi

      - name: Download image artifact
        if: steps.should-push.outputs.push == 'true'
        uses: actions/download-artifact@v5
        with:
          name: image-${{ matrix.service }}
          path: /tmp

      - name: Load image
        if: steps.should-push.outputs.push == 'true'
        run: |
          docker load -i /tmp/image-${{ matrix.service }}.tar
          if [ $? -ne 0 ]; then echo "ERROR: Failed to load image"; exit 1; fi

      - name: Log in to Docker Hub
        if: steps.should-push.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Verify Docker login
        if: steps.should-push.outputs.push == 'true'
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "ERROR: Docker credentials not configured"
            echo "Please add DOCKER_USERNAME and DOCKER_TOKEN to GitHub repository secrets"
            exit 1
          fi
          echo "✅ Docker credentials configured"

      - name: Extract metadata (tags)
        if: steps.should-push.outputs.push == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPO }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=${{ env.RELEASE_TAG }}

      - name: Tag and push image
        if: steps.should-push.outputs.push == 'true'
        run: |
          IMAGE="${{ env.IMAGE_REPO }}-${{ matrix.service }}"
          echo "Looking for loaded image: $IMAGE"
          docker images | grep "$IMAGE" || echo "No image found for $IMAGE"
          LOADED=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "^$IMAGE:" | head -1)
          echo "Loaded: $LOADED"
          if [ -z "$LOADED" ]; then
            echo "ERROR: No image found to push"
            exit 1
          fi
          echo "Tagging and pushing to Docker Hub..."
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
            docker tag "$LOADED" "$tag"
            docker push "$tag"
            echo "Pushed: $tag"
          done
          echo "Push completed for ${{ matrix.service }}"

  # ============================================================
  # Stage 6: Deploy to VM 
  # ============================================================
  deploy:
    name: Deploy to VM
    needs: [detect-changes, push-images]
    if: |
      github.ref_name == 'main' &&
      needs.detect-changes.outputs.any-change == 'true' &&
      needs.push-images.result == 'success'
    uses: ./.github/workflows/cd.yml
    with:
      host: ${{ vars.HOST }}
      username: ${{ vars.USERNAME }}
      ssh_port: "22"
      remote_path: "/home/superadmin"
      image_tag: v2
    secrets: inherit

  # ============================================================
  # Stage 7: Security scan with Trivy
  # ============================================================
  scan-images:
    name: Scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, push-images]
    if: always() 
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - account-service
          - transfer-service
          - notification-service
          - frontend
          - api-producer
    steps:
      - name: Check if service was built
        id: should-scan
        run: |
          LIST="${{ needs.detect-changes.outputs.services-list }}"
          if [ "$LIST" == "none" ] || [ -z "$LIST" ]; then
            echo "scan=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if echo ",$LIST," | grep -q ",${{ matrix.service }},"; then
            echo "scan=true" >> $GITHUB_OUTPUT
          else
            echo "scan=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.should-scan.outputs.scan == 'true'
        uses: actions/checkout@v5

      - name: Run Trivy scan
        if: steps.should-scan.outputs.scan == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          cache: false
          image-ref: ${{ env.IMAGE_REPO }}-${{ matrix.service }}:${{ env.RELEASE_TAG }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: |
            .trivyignore
        continue-on-error: true

  # ============================================================
  # Stage 8: CI Summary
  # ============================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, test, build-images, push-images, deploy, scan-images]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Services:** \`${{ needs.detect-changes.outputs.services-list }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detect Changes | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Images | ${{ needs.build-images.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Push Images | ${{ needs.push-images.result == 'success' && '✅' || (needs.push-images.result == 'skipped' && '⚠️ skipped' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to VM | ${{ needs.deploy.result == 'success' && '✅' || (needs.deploy.result == 'skipped' && '⚠️ skipped' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scan (Trivy) | ${{ needs.scan-images.result == 'success' && '✅' || (needs.scan-images.result == 'skipped' && '⚠️ skipped' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
