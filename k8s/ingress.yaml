apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress
  namespace: banking
  annotations:
    haproxy.org/client-timeout: "3600s"
    haproxy.org/timeout-client: "3600s"
    haproxy.org/timeout-server: "3600s"
spec:
  ingressClassName: haproxy
  rules:
    - host: banking.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 8000
